<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleheader descheader">
<title id="titleheader">Yashas Yadav</title>
<desc id="descheader">Animated profile graphic</desc>
<defs>
<style><![CDATA[
:root{}
@media (prefers-color-scheme: light){
  .bg{fill:#f7f9fc;}
  .surface{fill:#ffffff;stroke:#e2e8f0;}
  .text{fill:#0f172a;}
  .text2{fill:#475569;}
  .accent1{fill:#2563eb;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#cbd5e1;}
  .wave{stroke:#2563eb;}
}
@media (prefers-color-scheme: dark){
  .bg{fill:#0b1026;}
  .surface{fill:#10162a;stroke:#1f2640;}
  .text{fill:#e6eaf2;}
  .text2{fill:#a9b1c3;}
  .accent1{fill:#60a5fa;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#27314f;}
  .wave{stroke:#60a5fa;}
}
@media (prefers-reduced-motion: reduce){
  .anim, .marquee, .fadein, .typing { animation: none !important; }
  animate, animateTransform, animateMotion { display: none !important; }
}
]]></style>
</defs>
<rect width="100%" height="100%" class="bg"/>
<g class="grid" opacity="0.5">
<line x1="0" y1="40" x2="1200" y2="40"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/></line>
<line x1="0" y1="90" x2="1200" y2="90"><animate attributeName="opacity" values="0.3;0.5;0.3" dur="7s" repeatCount="indefinite"/></line>
<line x1="0" y1="140" x2="1200" y2="140"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite"/></line>
</g>
<g opacity="0.15">
<ellipse cx="200" cy="60" rx="120" ry="40" class="accent2"><animate attributeName="cx" values="200;250;200" dur="10s" repeatCount="indefinite"/></ellipse>
<ellipse cx="900" cy="40" rx="100" ry="30" class="accent3"><animate attributeName="cx" values="900;850;900" dur="12s" repeatCount="indefinite"/></ellipse>
<ellipse cx="600" cy="160" rx="140" ry="35" class="accent1"><animate attributeName="cy" values="160;140;160" dur="9s" repeatCount="indefinite"/></ellipse>
</g>
<text x="60" y="90" font-size="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text" font-weight="600">Yashas Yadav</text>
<text x="60" y="140" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2" opacity="0">Software Engineer
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.28;0.33" dur="12s" begin="0s" repeatCount="indefinite"/>
</text>
<text x="60" y="140" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2" opacity="0">BigQuery data connectors in Java
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.61;0.66" dur="12s" begin="0s" repeatCount="indefinite"/>
</text>
<text x="60" y="140" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2" opacity="0">AI/ML and full-stack projects
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.66;0.95;1.0" dur="12s" begin="0s" repeatCount="indefinite"/>
</text>
</svg>
