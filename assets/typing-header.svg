<svg width="1000" height="60" viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .type { animation: none !important; display: block !important; }
      }
    </style>
  </defs>
  <text x="16" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#58a6ff">&gt; </text>
  <g class="type">
    <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#c9d1d9">Full Stack + AI/ML Engineer</text>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.33;0.33;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <g class="type" opacity="0">
    <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#c9d1d9">Building Intelligent Systems</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.66;0.66" dur="6s" repeatCount="indefinite"/>
  </g>
  <g class="type" opacity="0">
    <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#c9d1d9">Shipping Scalable AI Solutions</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.99;1" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
