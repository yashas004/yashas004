<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titletech desctech">
<title id="titletech">Yashas Yadav</title>
<desc id="desctech">Animated profile graphic</desc>
<defs>
<style><![CDATA[
:root{}
@media (prefers-color-scheme: light){
  .bg{fill:#f7f9fc;}
  .surface{fill:#ffffff;stroke:#e2e8f0;}
  .text{fill:#0f172a;}
  .text2{fill:#475569;}
  .accent1{fill:#2563eb;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#cbd5e1;}
  .wave{stroke:#2563eb;}
}
@media (prefers-color-scheme: dark){
  .bg{fill:#0b1026;}
  .surface{fill:#10162a;stroke:#1f2640;}
  .text{fill:#e6eaf2;}
  .text2{fill:#a9b1c3;}
  .accent1{fill:#60a5fa;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#27314f;}
  .wave{stroke:#60a5fa;}
}
@media (prefers-reduced-motion: reduce){
  .anim, .marquee, .fadein, .typing { animation: none !important; }
  animate, animateTransform, animateMotion { display: none !important; }
}
]]></style>
</defs>
<rect width="100%" height="100%" class="bg"/>
<g class="marquee">
<text x="0" y="70" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2" letter-spacing="0.5">Java  •  Python  •  TypeScript  •  JavaScript  •  SQL  •  BigQuery  •  AWS  •  PyTorch  •  YOLOv8  •  MCP  •  OpenCV  •  Node.js  •  React  •  Docker  •  Git  •  Linux  •  Java  •  Python  •  TypeScript  •  JavaScript  •  SQL  •  BigQuery  •  AWS  •  PyTorch  •  YOLOv8  •  MCP  •  OpenCV  •  Node.js  •  React  •  Docker  •  Git  •  Linux
<animateTransform attributeName="transform" type="translate" values="0,0;-2000,0" dur="40s" repeatCount="indefinite"/>
</text>
</g>
</svg>
