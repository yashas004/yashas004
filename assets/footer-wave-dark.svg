<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titlefooter descfooter">
<title id="titlefooter">Yashas Yadav</title>
<desc id="descfooter">Animated profile graphic</desc>
<defs>
<style><![CDATA[
:root{}
@media (prefers-color-scheme: light){
  .bg{fill:#f7f9fc;}
  .surface{fill:#ffffff;stroke:#e2e8f0;}
  .text{fill:#0f172a;}
  .text2{fill:#475569;}
  .accent1{fill:#2563eb;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#cbd5e1;}
  .wave{stroke:#2563eb;}
}
@media (prefers-color-scheme: dark){
  .bg{fill:#0b1026;}
  .surface{fill:#10162a;stroke:#1f2640;}
  .text{fill:#e6eaf2;}
  .text2{fill:#a9b1c3;}
  .accent1{fill:#60a5fa;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#27314f;}
  .wave{stroke:#60a5fa;}
}
@media (prefers-reduced-motion: reduce){
  .anim, .marquee, .fadein, .typing { animation: none !important; }
  animate, animateTransform, animateMotion { display: none !important; }
}
]]></style>
</defs>
<rect width="100%" height="100%" class="bg"/>
<path d="M0 80 Q 150 40 300 80 T 600 80 T 900 80 T 1200 80 L 1200 140 L 0 140 Z" class="wave" fill="none" stroke-width="2" opacity="0.7">
<animate attributeName="d" 
  values="M0 80 Q 150 40 300 80 T 600 80 T 900 80 T 1200 80 L 1200 140 L 0 140 Z;
          M0 80 Q 150 60 300 80 T 600 80 T 900 80 T 1200 80 L 1200 140 L 0 140 Z;
          M0 80 Q 150 40 300 80 T 600 80 T 900 80 T 1200 80 L 1200 140 L 0 140 Z" 
  dur="8s" repeatCount="indefinite"/>
</path>
<text x="60" y="110" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2">Built with locally generated SVGs</text>
</svg>
