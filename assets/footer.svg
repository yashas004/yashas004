<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titlefooter descfooter">
<title id="titlefooter">footer</title>
<desc id="descfooter">footer</desc>
<defs>
<style><![CDATA[
.bg{fill:#0A0E1A;}
.surface{fill:#111827;stroke:#1F2937;stroke-width:1;}
.text{fill:#E5E7EB;}
.muted{fill:#94A3B8;}
.accent1{fill:#38BDF8;}
.accent2{fill:#A78BFA;}
.accent3{fill:#34D399;}
.border{stroke:#1F2937;stroke-width:1;fill:none;}
@keyframes shimmer{0%{transform:translateX(-200px);}100%{transform:translateX(1400px);}}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
@keyframes sweep{0%{transform:translateX(-400px);}100%{transform:translateX(1500px);}}
@keyframes rotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  .anim,.shimmer,.pulse,.blink,.sweep,.rotate{animation:none !important;}
  animate,animateTransform,animateMotion{display:none !important;}
}
]]></style>
<clipPath id="clipfooter"><rect x="16" y="16" width="968" height="88" rx="16" ry="16"/></clipPath>
<linearGradient id="gradfooter" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#38BDF8"/>
<stop offset="50%" stop-color="#A78BFA"/>
<stop offset="100%" stop-color="#38BDF8"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="120" fill="none"/>
<rect x="16" y="16" width="968" height="88" rx="16" ry="16" class="surface"/>
<rect x="16" y="16" width="968" height="88" rx="16" ry="16" class="border" fill="none"/>
<g clip-path="url(#clipfooter)">
<path d="M 40 60 Q 200 40 360 60 T 680 60 T 960 60" stroke="#38BDF8" fill="none" stroke-width="1.5" opacity="0.7"><animate attributeName="d" values="M 40 60 Q 200 40 360 60 T 680 60 T 960 60;M 40 60 Q 200 80 360 60 T 680 60 T 960 60;M 40 60 Q 200 40 360 60 T 680 60 T 960 60" dur="6s" repeatCount="indefinite"/></path></g>
</svg>
