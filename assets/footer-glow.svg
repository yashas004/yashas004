<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Footer glow line</title>
  <desc id="desc">Animated glowing divider line</desc>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A371F7" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.6;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style><![CDATA[
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none !important; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="60" fill="none"/>
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#glow)" stroke-width="2"/>
</svg>
