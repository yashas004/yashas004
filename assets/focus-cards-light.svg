<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titlefocus descfocus">
<title id="titlefocus">Yashas Yadav</title>
<desc id="descfocus">Animated profile graphic</desc>
<defs>
<style><![CDATA[
:root{}
@media (prefers-color-scheme: light){
  .bg{fill:#f7f9fc;}
  .surface{fill:#ffffff;stroke:#e2e8f0;}
  .text{fill:#0f172a;}
  .text2{fill:#475569;}
  .accent1{fill:#2563eb;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#cbd5e1;}
  .wave{stroke:#2563eb;}
}
@media (prefers-color-scheme: dark){
  .bg{fill:#0b1026;}
  .surface{fill:#10162a;stroke:#1f2640;}
  .text{fill:#e6eaf2;}
  .text2{fill:#a9b1c3;}
  .accent1{fill:#60a5fa;}
  .accent2{fill:#22d3ee;}
  .accent3{fill:#a78bfa;}
  .grid{stroke:#27314f;}
  .wave{stroke:#60a5fa;}
}
@media (prefers-reduced-motion: reduce){
  .anim, .marquee, .fadein, .typing { animation: none !important; }
  animate, animateTransform, animateMotion { display: none !important; }
}
]]></style>
</defs>
<rect width="100%" height="100%" class="bg"/>
<g opacity="0">
<rect x="60" y="40" width="340" height="160" rx="12" class="surface" stroke-width="1"/>
<text x="84" y="80" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text" font-weight="600">Data connectors</text>
<text x="84" y="112" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2">Building reliable data connectors for scalable systems.</text>
<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.0s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.6s" begin="0.0s" fill="freeze"/>
</g>
<g opacity="0">
<rect x="420" y="40" width="340" height="160" rx="12" class="surface" stroke-width="1"/>
<text x="444" y="80" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text" font-weight="600">AI agents</text>
<text x="444" y="112" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2">Designing agentic workflows with clear tool use.</text>
<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.25s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.6s" begin="0.25s" fill="freeze"/>
</g>
<g opacity="0">
<rect x="780" y="40" width="340" height="160" rx="12" class="surface" stroke-width="1"/>
<text x="804" y="80" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text" font-weight="600">Computer vision</text>
<text x="804" y="112" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="text2">Applying vision models to real world detection tasks.</text>
<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.6s" begin="0.5s" fill="freeze"/>
</g>
</svg>
